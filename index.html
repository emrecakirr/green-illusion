<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Green Illusion · When does a burned forest really come back?</title>
<meta name="description" content="Pick any place on the map and see how long a forest there would need to recover after a fire. Built with NASA-ISRO NISAR radar, MODIS and NASADEM. NASA Space Apps 2026.">
<meta property="og:title" content="The Green Illusion · When does a burned forest really come back?">
<meta property="og:description" content="Optical satellites see green within a few years. NISAR radar shows the trees are still missing. Try it for any place on Earth.">
<meta property="og:image" content="https://emrecakirr.github.io/green-illusion/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{
  --bg:#0e1311; --bg2:#131a17; --card:#18201c; --line:#28322d;
  --ink:#f1f4f2; --ink2:#bcc6c0; --ink3:#86928b;
  --opt:#2f9e44; --optL:#8ce99a; --rad:#9775fa; --radL:#c5b3ff; --burn:#ff7a1a; --acc:#f4b860;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:2000;background:rgba(14,19,17,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:54px;gap:12px}
.brand{font-weight:700}
nav{display:flex;gap:18px;font-size:14px}
nav a{color:var(--ink2);text-decoration:none}
nav a:hover{color:var(--ink)}
@media(max-width:760px){nav{display:none}}
.lang button{background:none;border:1px solid var(--line);color:var(--ink2);padding:3px 9px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.lang button.on{background:var(--card);color:var(--ink);border-color:var(--ink3)}

.hero{position:relative;padding:70px 0 44px;overflow:hidden}
.herobg{position:absolute;inset:0;background:url(img/hero_radar.jpg) center/cover;opacity:.18;-webkit-mask-image:linear-gradient(90deg,transparent 10%,#000 70%);mask-image:linear-gradient(90deg,transparent 10%,#000 70%)}
.hero .wrap{position:relative}
h1{font-size:clamp(32px,5.2vw,54px);line-height:1.1;margin:0 0 20px;letter-spacing:-.4px;max-width:850px}
.intro{font-size:clamp(17px,2vw,19px);color:var(--ink2);max-width:720px}
.intro p{margin:0 0 14px}
.keyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px;max-width:900px}
.key{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.key .n{font-size:38px;font-weight:750;line-height:1.1}
.key .t{font-size:14px;color:var(--ink2);margin-top:4px}
@media(max-width:760px){.keyrow{grid-template-columns:1fr}}

section{padding:56px 0;border-top:1px solid var(--line)}
section.alt{background:var(--bg2)}
.step{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.5px;margin-bottom:6px}
h2{font-size:clamp(25px,3.2vw,34px);margin:0 0 10px;line-height:1.2}
.lead{color:var(--ink2);max-width:760px;margin:0 0 24px}
h3{font-size:19px;margin:0 0 8px}

.tool{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
@media(max-width:900px){.tool{grid-template-columns:1fr}}
.mapbox{height:520px;border-radius:12px;border:1px solid var(--line)}
@media(max-width:900px){.mapbox{height:420px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.empty{color:var(--ink3);text-align:center;padding:40px 10px}
.empty b{display:block;color:var(--ink2);font-size:18px;margin-bottom:6px}
.res h3{margin-bottom:2px}
.meta{font-size:13.5px;color:var(--ink3);margin-bottom:14px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.big2>div{border-radius:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line)}
.big2 .y{font-size:30px;font-weight:750;line-height:1.1}
.big2 .l{font-size:13px;color:var(--ink2)}
.note{font-size:13.5px;color:var(--ink3);margin-top:10px}
.warn{font-size:13.5px;color:#ffd8a8;background:rgba(255,146,43,.08);border:1px solid rgba(255,146,43,.25);border-radius:8px;padding:8px 10px;margin-top:10px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.quick button,.tabs button,.seg button{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.quick button:hover,.tabs button:hover{border-color:var(--ink3);color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button.on,.seg button.on{background:var(--ink);color:#111;border-color:var(--ink)}
.seg{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}
.legend{display:flex;gap:16px;align-items:center;color:var(--ink2);font-size:13.5px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.ramp{width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(255,122,26,.95),rgba(255,122,26,.08));display:inline-block;margin:0 6px;vertical-align:-1px}

.bars .ev{padding:12px 0;border-bottom:1px solid var(--line)}
.bars .ev:last-child{border-bottom:0}
.bars .hd{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bars .hd span{color:var(--ink3);font-size:13.5px}
.bar{display:grid;grid-template-columns:62px 1fr 46px;align-items:center;gap:8px;margin-top:6px;font-size:13.5px;color:var(--ink2)}
.bar .tr{height:12px;background:#222b27;border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
.bar b{color:var(--ink);text-align:right}

#swipeMap{height:520px;border-radius:12px;border:1px solid var(--line);position:relative}
.handle{position:absolute;top:0;bottom:0;width:0;z-index:650;left:50%}
.handle .barv{position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6)}
.handle .knob{position:absolute;top:50%;left:-21px;width:42px;height:42px;margin-top:-21px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:ew-resize;box-shadow:0 2px 10px rgba(0,0,0,.5);user-select:none;touch-action:none}
.tag{position:absolute;top:10px;z-index:640;background:rgba(10,13,12,.86);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.3;pointer-events:none}
.tag b{display:block;font-size:14px}
.tag.l{left:10px}.tag.r{right:10px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.prose p{color:var(--ink2);margin:0 0 14px}
.prose b{color:var(--ink)}
.chartbox{position:relative}
svg text{font-family:Inter,system-ui,sans-serif}
.tt{position:absolute;pointer-events:none;background:#0a0d0c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);display:none;white-space:nowrap;z-index:5}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.t th{color:var(--ink3);font-weight:600}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
ol.m{padding-left:20px;color:var(--ink2)} ol.m li{margin:8px 0} ol.m b{color:var(--ink)}
.src li{margin:6px 0;color:var(--ink2)}
.vid video{width:100%;border-radius:12px;border:1px solid var(--line);background:#000}
footer{padding:30px 0 60px;color:var(--ink3);font-size:13.5px;border-top:1px solid var(--line)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0a0d0c;color:var(--ink);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.5}
.leaflet-container{background:#0a0d0c;font:inherit}
.leaflet-top,.leaflet-bottom{z-index:400}
.pp .r{display:flex;justify-content:space-between;gap:16px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">The Green Illusion</div>
  <nav><a href="#try" data-i="navTry"></a><a href="#past" data-i="navPast"></a><a href="#why" data-i="navWhy"></a><a href="#trust" data-i="navTrust"></a></nav>
  <div class="lang"><button data-l="en">EN</button> <button data-l="tr">TR</button></div>
</div></header>

<div class="hero"><div class="herobg"></div><div class="wrap">
  <h1 data-i="h1"></h1>
  <div class="intro" data-i="intro"></div>
  <div class="keyrow">
    <div class="key"><div class="n" id="kOpt"></div><div class="t" data-i="kOptT"></div></div>
    <div class="key"><div class="n" id="kRad"></div><div class="t" data-i="kRadT"></div></div>
    <div class="key"><div class="n" id="kPx"></div><div class="t" data-i="kPxT"></div></div>
  </div>
</div></div>

<!-- 1. TRY ANY PLACE -->
<section id="try"><div class="wrap">
  <div class="step" data-i="s1"></div>
  <h2 data-i="tryH"></h2>
  <p class="lead" data-i="tryLead"></p>
  <div class="tool">
    <div>
      <div id="tryMap" class="mapbox" role="application" aria-label="World map, click to get a forecast"></div>
      <div class="quick" id="quick"></div>
    </div>
    <div class="card res" id="tryRes" aria-live="polite"></div>
  </div>
</div></section>

<!-- 2. PAST FIRES -->
<section id="past" class="alt"><div class="wrap">
  <div class="step" data-i="s2"></div>
  <h2 data-i="pastH"></h2>
  <p class="lead" data-i="pastLead"></p>
  <div class="tabs" id="tabs"></div>
  <div class="tool">
    <div>
      <div id="pastMap" class="mapbox" role="img" aria-label="Burned forest pixels"></div>
      <div class="row">
        <div class="seg" id="eye"><button data-v="0" class="on" data-i="eyeOpt"></button><button data-v="1" data-i="eyeRad"></button></div>
        <div class="legend"><span data-i="lgMissing"></span><span class="ramp"></span><span data-i="lgBack"></span></div>
      </div>
      <div class="note" data-i="pastHint"></div>
    </div>
    <div class="card">
      <h3 data-i="barsH"></h3>
      <div class="legend" style="margin-bottom:6px"><span><span class="dot" style="background:var(--opt)"></span><span data-i="optShort"></span></span><span><span class="dot" style="background:var(--rad)"></span><span data-i="radShort"></span></span></div>
      <div class="bars" id="bars"></div>
      <div class="note" data-i="barsNote"></div>
    </div>
  </div>
</div></section>

<!-- 3. WHY RADAR -->
<section id="why"><div class="wrap">
  <div class="step" data-i="s3"></div>
  <h2 data-i="whyH"></h2>
  <p class="lead" data-i="whyLead"></p>
  <div id="swipeMap" role="img" aria-label="Optical vs radar comparison">
    <div class="tag l"><b data-i="swL1"></b><span data-i="swL2"></span></div>
    <div class="tag r"><b data-i="swR1"></b><span data-i="swR2"></span></div>
    <div class="handle" id="handle"><div class="barv"></div><div class="knob">⇆</div></div>
  </div>
  <div class="row"><div class="tabs" id="swTabs" style="margin:0"></div><div class="note" style="margin:0" data-i="swNote"></div></div>
  <div class="two" style="margin-top:30px">
    <div class="prose" data-i="whyText"></div>
    <svg viewBox="0 0 560 300" role="img" aria-label="Illustration: optical light vs L-band radar" style="width:100%;height:auto">
      <rect x="0" y="0" width="560" height="300" rx="12" fill="#18201c" stroke="#28322d"/>
      <line x1="280" y1="20" x2="280" y2="280" stroke="#28322d"/>
      <rect x="16" y="246" width="248" height="14" fill="#3b2f25"/><rect x="296" y="246" width="248" height="14" fill="#3b2f25"/>
      <rect x="86" y="150" width="10" height="96" fill="#6b4b33"/><rect x="176" y="140" width="12" height="106" fill="#6b4b33"/>
      <line x1="91" y1="185" x2="70" y2="165" stroke="#6b4b33" stroke-width="5"/><line x1="182" y1="180" x2="205" y2="160" stroke="#6b4b33" stroke-width="5"/>
      <ellipse cx="91" cy="140" rx="46" ry="34" fill="#2f9e44"/><ellipse cx="182" cy="128" rx="50" ry="38" fill="#2f9e44"/>
      <path d="M40 30 L80 104" stroke="#8ce99a" stroke-width="2.5" marker-end="url(#ao)"/><path d="M84 104 L118 38" stroke="#8ce99a" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#ao)"/>
      <path d="M150 24 Q160 50 150 76 T150 128 T176 176" fill="none" stroke="#9775fa" stroke-width="3" marker-end="url(#ar)"/>
      <path d="M188 170 L258 74" stroke="#9775fa" stroke-width="5" marker-end="url(#ar)"/>
      <rect x="360" y="216" width="6" height="30" fill="#2b2b2b"/><rect x="456" y="206" width="7" height="40" fill="#2b2b2b"/>
      <ellipse cx="340" cy="236" rx="30" ry="14" fill="#2f9e44"/><ellipse cx="410" cy="232" rx="38" ry="18" fill="#2f9e44"/><ellipse cx="490" cy="236" rx="32" ry="14" fill="#2f9e44"/>
      <path d="M318 30 L366 214" stroke="#8ce99a" stroke-width="2.5" marker-end="url(#ao)"/><path d="M370 214 L408 46" stroke="#8ce99a" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#ao)"/>
      <path d="M440 24 Q450 60 440 96 T440 168 T452 238" fill="none" stroke="#9775fa" stroke-width="3" marker-end="url(#ar)"/>
      <path d="M460 236 L500 120" stroke="#9775fa" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#ar)"/>
      <defs>
        <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8ce99a"/></marker>
        <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9775fa"/></marker>
      </defs>
      <text x="140" y="284" text-anchor="middle" fill="#f1f4f2" font-size="14" font-weight="700" id="ilL"></text>
      <text x="420" y="284" text-anchor="middle" fill="#f1f4f2" font-size="14" font-weight="700" id="ilR"></text>
      <text x="272" y="56" text-anchor="end" fill="#c5b3ff" font-size="12" font-weight="600" id="ilStrong"></text>
      <text x="530" y="112" text-anchor="end" fill="#c5b3ff" font-size="12" id="ilWeak"></text>
      <text x="24" y="22" fill="#8ce99a" font-size="12" id="ilG1"></text>
      <text x="304" y="22" fill="#8ce99a" font-size="12" id="ilG2"></text>
    </svg>
  </div>
</div></section>

<!-- 4. HOW SURE -->
<section id="trust" class="alt"><div class="wrap">
  <div class="step" data-i="s4"></div>
  <h2 data-i="trustH"></h2>
  <p class="lead" data-i="trustLead"></p>
  <div class="two" style="align-items:start">
    <div class="card">
      <h3 data-i="evH"></h3>
      <div class="chartbox"><svg id="evChart" viewBox="0 0 600 380" style="width:100%;height:auto"></svg><div class="tt" id="tt"></div></div>
      <div class="legend"><span><span class="dot" style="background:var(--opt)"></span><span data-i="optShort"></span></span><span><span class="dot" style="background:var(--rad)"></span><span data-i="radShort"></span></span><span data-i="evNote"></span></div>
    </div>
    <div>
      <h3 data-i="howH"></h3>
      <ol class="m"><li data-i="m1"></li><li data-i="m2"></li><li data-i="m3"></li><li data-i="m4"></li><li data-i="m5"></li></ol>
      <h3 style="margin-top:20px" data-i="limH"></h3>
      <div class="prose" data-i="lim"></div>
    </div>
  </div>
  <div class="card" style="margin-top:22px;border-color:#3d4a2f">
    <h3 data-i="fieldH"></h3>
    <div class="prose" id="fieldP"></div>
  </div>
  <div class="card" style="margin-top:22px">
    <h3 data-i="tblH"></h3>
    <div style="overflow-x:auto"><table class="t" id="tbl"></table></div>
  </div>
</div></section>

<section><div class="wrap two vid" style="align-items:start">
  <div>
    <h2 data-i="vidH"></h2>
    <p class="lead" data-i="vidLead"></p>
    <video controls preload="metadata" poster="img/og.jpg" src="demo.mp4"></video>
  </div>
  <div>
    <h2 data-i="dataH"></h2>
    <ul class="src">
      <li><b>NISAR L2 GCOV</b> (NASA-ISRO, L-band, Aug 2026) · <a href="https://search.asf.alaska.edu/#/?dataset=NISAR" target="_blank" rel="noopener">ASF DAAC</a> · <a href="https://nisar-docs.asf.alaska.edu/" target="_blank" rel="noopener">User Guide</a></li>
      <li><b>MODIS MCD64A1 v061</b> burned area 2001–2025 · <a href="https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd64a1-061" target="_blank" rel="noopener">LP DAAC</a></li>
      <li><b>MODIS MOD13Q1 v061</b> NDVI, Jul–Aug 2026 · <a href="https://www.earthdata.nasa.gov/data/catalog/lpcloud-mod13q1-061" target="_blank" rel="noopener">LP DAAC</a></li>
      <li><b>NASADEM</b> 30 m elevation · <a href="https://www.earthdata.nasa.gov/data/catalog/lpcloud-nasadem-hgt-001" target="_blank" rel="noopener">LP DAAC</a></li>
      <li data-i="srcOther"></li>
      <li data-i="srcCode"></li>
    </ul>
  </div>
</div></section>

<footer><div class="wrap" data-i="foot"></div></footer>

<script src="lib/leaflet.js"></script>
<script src="gi_data.js"></script>
<script src="app.js"></script>
</body>
</html>
